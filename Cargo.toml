[package]
name = "duckflap"
version = "0.1.0"
edition = "2024"
description = "Run local projects side by side without port conflicts"
license = "MIT"
repository = "https://github.com/getduckflap/duckflap"
homepage = "https://github.com/getduckflap/duckflap"
readme = "README.md"

[dependencies]
clap = { version = "4.6.3", features = ["derive"] }
dotenvy = "0.15.7"
libc = "0.2.189"
rusqlite = { version = "0.40.1", features = ["bundled"] }
rustix = { version = "1.1.4", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
toml = "1.1.4"
uuid = { version = "1.24.0", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
